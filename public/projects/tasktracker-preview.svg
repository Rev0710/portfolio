<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" fill="none">
  <rect width="640" height="440" fill="#EFF3F0"/>
  <rect x="1" y="1" width="638" height="438" stroke="#DCE4DF"/>
  <rect x="32" y="28" width="27" height="27" rx="7" fill="#267D72"/>
  <path d="M40 36h11M40 41h11M40 46h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="68" y="48" fill="#183B37" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="-.5">tasktracker</text>
  <text x="469" y="46" fill="#71807B" font-family="Arial, sans-serif" font-size="11">A calmer way to keep up.</text>

  <text x="45" y="135" fill="#267D72" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">MADE FOR THE SEMESTER YOU’RE IN</text>
  <text x="45" y="201" fill="#172B29" font-family="Arial, sans-serif" font-size="49" font-weight="500" letter-spacing="-2.5">School, in</text>
  <text x="45" y="251" fill="#267D72" font-family="Georgia, serif" font-size="48" letter-spacing="-1.8">good order.</text>
  <text x="46" y="283" fill="#586862" font-family="Arial, sans-serif" font-size="12">One place for tasks, practicals, quizzes</text>
  <text x="46" y="300" fill="#586862" font-family="Arial, sans-serif" font-size="12">and the scores that come with them.</text>

  <circle cx="51" cy="327" r="7" stroke="#267D72" stroke-width="1.5"/>
  <path d="m48 327 2 2 4-4" stroke="#267D72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="331" fill="#52635E" font-family="Arial, sans-serif" font-size="11">Know what’s due next</text>
  <circle cx="51" cy="354" r="7" stroke="#267D72" stroke-width="1.5"/>
  <circle cx="51" cy="354" r="3" stroke="#267D72" stroke-width="1.5"/>
  <text x="68" y="358" fill="#52635E" font-family="Arial, sans-serif" font-size="11">Keep your scores together</text>
  <path d="m44 383 7-4 7 4v5H44z" stroke="#267D72" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M48 388v-4h6v4" stroke="#267D72" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="68" y="387" fill="#52635E" font-family="Arial, sans-serif" font-size="11">Make room for every subject</text>

  <rect x="351" y="100" width="247" height="269" rx="13" fill="#FFFFFF" stroke="#DFE7E2"/>
  <text x="376" y="131" fill="#66756F" font-family="Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="1.3">YOUR PERSONAL STUDY DESK</text>
  <text x="376" y="164" fill="#1E302D" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-.7">Welcome back.</text>
  <text x="376" y="183" fill="#74817C" font-family="Arial, sans-serif" font-size="10">Sign in to pick up where you left off.</text>
  <text x="376" y="211" fill="#364743" font-family="Arial, sans-serif" font-size="10" font-weight="600">Email address</text>
  <rect x="376" y="219" width="197" height="30" rx="3" fill="#FFFFFF" stroke="#D9E1DD"/>
  <text x="386" y="238" fill="#A3ADA8" font-family="Arial, sans-serif" font-size="9">you@example.com</text>
  <text x="376" y="272" fill="#364743" font-family="Arial, sans-serif" font-size="10" font-weight="600">Password</text>
  <rect x="376" y="280" width="197" height="30" rx="3" fill="#FFFFFF" stroke="#D9E1DD"/>
  <text x="386" y="299" fill="#A3ADA8" font-family="Arial, sans-serif" font-size="9">At least 8 characters</text>
  <rect x="376" y="325" width="197" height="34" rx="4" fill="#1D3733"/>
  <text x="389" y="347" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="10" font-weight="600">Sign in</text>
  <path d="M557 342h8m-3-4 4 4-4 4" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
